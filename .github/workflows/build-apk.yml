name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 Env
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Node.js Compiler
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Packages
        run: npm ci || npm install

      - name: Build Production Web Assets
        run: npm run build

      - name: Synchronize Capacitor Native Layers
        run: npx cap sync android

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Compile Standalone APK Bundle
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload Finished Installer to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: litron-vpn-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
