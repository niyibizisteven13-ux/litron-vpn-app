name: Build Litron Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm install
          npm run build

      - name: Setup Java JDK Compiler
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android Structure
        run: |
          npx cap sync android

      - name: Compile Production APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK Asset
        uses: actions/upload-artifact@v4
        with:
          name: litron-vpn-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
